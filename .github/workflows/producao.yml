# Deploy de produção quando algo entra na main.
#
# É a consequência do merge automático: sem isto, o Revisor aprova, o PR entra,
# e o site continua exibindo a versão de duas semanas atrás. A empresa mudaria o
# próprio código sem nunca mudar a si mesma.
#
# Para voltar ao deploy manual (`vercel --prod` da raiz do repo), basta apagar
# este arquivo — nada mais depende dele.
name: producao

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: baixar código
        uses: actions/checkout@v4

      - name: configurar node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: puxar configuração do projeto
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: construir
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: publicar
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
