# Preview de cada PR, sem a integração Git da Vercel.
#
# A organização do GitHub pertence a outra pessoa, então não dá para instalar o
# app da Vercel nela. Aqui o próprio Actions faz o deploy com um token da conta
# do Kauã e publica a URL como commit status.
#
# Isso não é enfeite: o preview é o terceiro dos quatro filtros do Revisor, e é
# o que pega o código que compila e quebra em runtime — o erro mais comum de
# código escrito por modelo. O `urlDePreview()` em lib/github.ts procura um
# status cujo contexto contenha "vercel", que é exatamente o que publicamos.
name: preview

on:
  pull_request:

jobs:
  publicar-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Necessário para escrever o commit status que o Revisor vai ler.
      statuses: write
    steps:
      - name: baixar código
        uses: actions/checkout@v4

      - name: configurar node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: puxar configuração do projeto
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: construir
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: publicar preview
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview em $url"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # O Revisor lê este status. Sem ele, o filtro de preview some em silêncio,
      # que é o pior jeito de uma trava deixar de existir.
      - name: avisar o Revisor
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.deploy.outputs.url }}
          ESTADO: ${{ steps.deploy.outcome == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state="$ESTADO" \
            -f context="vercel/preview" \
            -f description="deploy de preview" \
            ${URL:+-f target_url="$URL"}
